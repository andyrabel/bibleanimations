<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nehemiah's Wall</title>
  <meta name="description" content="A 3D fly-by of the rebuilding of Jerusalem's walls, following Nehemiah 3.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="app">
    <header class="titlebar">
      <a href="../" class="home" title="All animations">Bible Animations</a>
      <h1>Nehemiah’s Wall</h1>
      <p>The rebuilding of Jerusalem’s walls · Nehemiah 3</p>
      <p id="credit" class="credit"></p>
    </header>

    <div id="card" class="card" role="dialog" aria-live="polite"></div>
    <aside id="popup" class="popup" aria-live="polite"></aside>
    <div id="next-chip" class="next-chip"></div>
    <div class="compass" title="Compass" aria-hidden="true">
      <svg viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="18.5"/>
        <g id="compass-rose">
          <path class="n" d="M20 5 L24 20 L16 20 Z"/>
          <path class="s" d="M20 35 L24 20 L16 20 Z"/>
          <text x="20" y="4.6">N</text>
        </g>
      </svg>
    </div>

    <div class="dock">
      <div id="progress" class="progress" aria-label="Tour stops"></div>
      <nav class="controls" aria-label="Tour controls">
        <a href="../" class="home-btn" title="Back to all animations" aria-label="Back to all animations">
          <svg viewBox="0 0 24 24"><path d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg>
        </a>
        <span class="sep"></span>
        <button id="prev" title="Previous stop (←)" aria-label="Previous stop">
          <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
        </button>
        <button id="play" class="paused" title="Play (Space)" aria-label="Play">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
        </button>
        <button id="next" title="Next stop (→)" aria-label="Next stop">
          <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
        </button>
        <span class="sep"></span>
        <button id="explore" class="text" title="Look around freely (E)" aria-pressed="false">Explore</button>
        <label class="speed">
          <span>Speed</span>
          <select id="speed">
            <option value="0.6">0.6×</option>
            <option value="1" selected>1×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>
        </label>
        <label class="speed">
          <span>Pause</span>
          <select id="pause" title="How long to stay at each stop">
            <option value="0">No pause</option>
            <option value="0.3">Short</option>
            <option value="0.5">Normal</option>
            <option value="0.8">Long</option>
            <option value="1.2">Longer</option>
          </select>
        </label>
        <label class="speed">
          <span>Bible</span>
          <select id="version"></select>
        </label>
      </nav>
    </div>
    <div class="explore-hint">Drag to orbit · scroll to zoom · right-drag to pan</div>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
