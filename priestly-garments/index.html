  <noscript>
    <main class="noscript" style="position:relative;z-index:10;max-width:640px;margin:0 auto;padding:16px">
      <h1>The Priestly Garments</h1>
      <p><strong>Exodus 28 · Leviticus 8:6–9.</strong> Watch Moses wash Aaron and dress him as high priest, garment by garment, in the order of Leviticus 8, from the linen tunic to the gold plate on his turban.</p>
      <p>This interactive 3D tour needs JavaScript and WebGL. It reads each passage aloud and quotes Scripture in English (NASB, NIV, ESV, KJV), Spanish and French. <a href="../">More 3D Bible animations</a>.</p>
    </main>
  </noscript>
